name: One-shot ChittyMCP Production Deploy

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'ops/deploy-chittymcp-db556'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db556a740701c9accebf1799e7bd9ba0a2f3b681
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify ChittyConnect broker health
        run: curl -fsS https://connect.chitty.cc/health >/dev/null
      - name: Verify deploy credential is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy exact merged ChittyMCP commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc --env production
      - name: Verify public health
        run: curl -fsS https://mcp.chitty.cc/health
